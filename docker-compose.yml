name: ai-agent-platform

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ai_agent_platform
      MYSQL_USER: ${MYSQL_USER:-aiagent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging

  pgvector:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: vector
      POSTGRES_USER: ${PG_USERNAME:-aiagent}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./deploy/docker/init-pgvector.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    logging: *default-logging

  # 等待 MinIO 就绪；bucket 由后端 StorageService 启动时自动创建
  minio-init:
    image: busybox:1.36
    restart: "no"
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until wget -q -O- http://minio:9000/minio/health/live; do
          echo "waiting for minio..."; sleep 3;
        done
        echo "minio ready"
    logging: *default-logging

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx2g}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USERNAME: ${MYSQL_USER:-aiagent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      PG_URL: jdbc:postgresql://pgvector:5432/vector
      PG_USERNAME: ${PG_USERNAME:-aiagent}
      PG_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      OLLAMA_ENDPOINT: http://ollama:11434
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:-http://ollama:11434}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-sk-not-configured}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AES_KEY: ${AES_KEY:?AES_KEY is required}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?PLATFORM_ADMIN_PASSWORD is required}
      TOOL_ALLOW_PRIVATE: ${TOOL_ALLOW_PRIVATE:-false}
      TOOL_ALLOWED_HOSTS: ${TOOL_ALLOWED_HOSTS:-}
      APP_PUBLIC_BASE: ${APP_PUBLIC_BASE:-http://localhost:8080}
      APP_FRONTEND_BASE: ${APP_FRONTEND_BASE:-http://localhost:5173}
      ALERT_WEBHOOK_ENABLED: ${ALERT_WEBHOOK_ENABLED:-false}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
      ALERT_WEBHOOK_INTERNAL_TOKEN: ${ALERT_WEBHOOK_INTERNAL_TOKEN:-}
      ALERT_WEBHOOK_ENV: ${ALERT_WEBHOOK_ENV:-prod}
      ALERT_WEBHOOK_TYPE: ${ALERT_WEBHOOK_TYPE:-auto}
      ALERT_WEBHOOK_KEYWORD: ${ALERT_WEBHOOK_KEYWORD:-告警}
      ALERT_EMAIL_ENABLED: ${ALERT_EMAIL_ENABLED:-false}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_SMS_ENABLED: ${ALERT_SMS_ENABLED:-false}
      ALERT_SMS_ACCESS_KEY_ID: ${ALERT_SMS_ACCESS_KEY_ID:-}
      ALERT_SMS_ACCESS_KEY_SECRET: ${ALERT_SMS_ACCESS_KEY_SECRET:-}
      ALERT_SMS_ENDPOINT: ${ALERT_SMS_ENDPOINT:-dysmsapi.aliyuncs.com}
      ALERT_SMS_SIGN_NAME: ${ALERT_SMS_SIGN_NAME:-}
      ALERT_SMS_TEMPLATE_CODE: ${ALERT_SMS_TEMPLATE_CODE:-}
      ALERT_SMS_PHONE_NUMBERS: ${ALERT_SMS_PHONE_NUMBERS:-}
      ALERT_RELAY_BASE_URL: ${ALERT_RELAY_BASE_URL:-http://alert-relay:8080}
      ALERT_RELAY_ACK_TOKEN: ${ALERT_RELAY_ACK_TOKEN:-}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      APP_ENV: ${APP_ENV:-development}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      MODERATION_PROMPT_INJECTION_ENABLED: ${MODERATION_PROMPT_INJECTION_ENABLED:-true}
      MODERATION_PROMPT_INJECTION_BLOCK_SCORE: ${MODERATION_PROMPT_INJECTION_BLOCK_SCORE:-2}
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
      SKILL_SCRIPT_ENABLED: ${SKILL_SCRIPT_ENABLED:-false}
      # 容器沙箱需后端容器可访问 docker CLI + /var/run/docker.sock；未挂载前保持 process
      SKILL_SCRIPT_RUNTIME: ${SKILL_SCRIPT_RUNTIME:-process}
      ASR_ENABLED: ${ASR_ENABLED:-false}
      ASR_ENDPOINT: ${ASR_ENDPOINT:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_TLS: ${SMTP_TLS:-true}
    expose:
      - "8080"
    volumes:
      # 平台页保存的基础设施配置；命名卷避免宿主机密钥/权限不一致，容器重建后仍保留
      - platform-config:/app/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    logging: *default-logging

  alert-relay:
    build:
      context: ./runtime/alert-relay
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
      ALERT_WEBHOOK_ENV: ${ALERT_WEBHOOK_ENV:-prod}
      ALERT_WEBHOOK_TYPE: ${ALERT_WEBHOOK_TYPE:-auto}
      ALERT_WEBHOOK_KEYWORD: ${ALERT_WEBHOOK_KEYWORD:-告警}
      ALERT_EMAIL_ENABLED: ${ALERT_EMAIL_ENABLED:-false}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_SMS_ENABLED: ${ALERT_SMS_ENABLED:-false}
      ALERT_SMS_ACCESS_KEY_ID: ${ALERT_SMS_ACCESS_KEY_ID:-}
      ALERT_SMS_ACCESS_KEY_SECRET: ${ALERT_SMS_ACCESS_KEY_SECRET:-}
      ALERT_SMS_ENDPOINT: ${ALERT_SMS_ENDPOINT:-dysmsapi.aliyuncs.com}
      ALERT_SMS_SIGN_NAME: ${ALERT_SMS_SIGN_NAME:-}
      ALERT_SMS_TEMPLATE_CODE: ${ALERT_SMS_TEMPLATE_CODE:-}
      ALERT_SMS_PHONE_NUMBERS: ${ALERT_SMS_PHONE_NUMBERS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_TLS: ${SMTP_TLS:-true}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      ALERT_RELAY_DEFAULT_CHANNELS: ${ALERT_RELAY_DEFAULT_CHANNELS:-webhook}
      ALERT_RELAY_WARNING_CHANNELS: ${ALERT_RELAY_WARNING_CHANNELS:-webhook,email}
      ALERT_RELAY_CRITICAL_CHANNELS: ${ALERT_RELAY_CRITICAL_CHANNELS:-webhook,email}
      ALERT_ESCALATION_DELAY_SECONDS: ${ALERT_ESCALATION_DELAY_SECONDS:-300}
      ALERT_ESCALATION_CHANNELS: ${ALERT_ESCALATION_CHANNELS:-sms}
      ALERT_ESCALATION_SEVERITIES: ${ALERT_ESCALATION_SEVERITIES:-critical}
      ALERT_RELAY_STATE_FILE: /data/alert-relay-state.json
      ALERT_RELAY_ACK_TOKEN: ${ALERT_RELAY_ACK_TOKEN:-}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: "0"
      ALERT_RELAY_REDIS_PREFIX: ${ALERT_RELAY_REDIS_PREFIX:-alert-relay}
    volumes:
      - alert-relay-state:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./deploy/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "${ALERTMANAGER_BIND:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"
    depends_on:
      alert-relay:
        condition: service_healthy
    logging: *default-logging

  metrics-token-init:
    image: busybox:1.36
    restart: "no"
    environment:
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
    volumes:
      - metrics-token:/token
    command:
      - /bin/sh
      - -c
      - |
        printf '%s' "$$METRICS_SCRAPE_TOKEN" > /token/metrics-token

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - metrics-token:/etc/prometheus/metrics-token:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      metrics-token-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      alertmanager:
        condition: service_started
    logging: *default-logging

  mysqld-exporter-init:
    image: mysql:8.4
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?MYSQL_EXPORTER_PASSWORD is required}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mysql -h mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" -e "
          CREATE USER IF NOT EXISTS 'exporter'@'%' IDENTIFIED BY '$$MYSQL_EXPORTER_PASSWORD';
          GRANT PROCESS, REPLICATION CLIENT, SELECT ON *.* TO 'exporter'@'%';
          FLUSH PRIVILEGES;"
    logging: *default-logging

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.16.0
    restart: unless-stopped
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?MYSQL_EXPORTER_PASSWORD is required}
    ports:
      - "127.0.0.1:9104:9104"
    depends_on:
      mysqld-exporter-init:
        condition: service_completed_successfully
    logging: *default-logging

  redis-exporter-init:
    image: redis:7.4-alpine
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_EXPORTER_PASSWORD: ${REDIS_EXPORTER_PASSWORD:?REDIS_EXPORTER_PASSWORD is required}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        redis-cli -h redis -a "$$REDIS_PASSWORD" --no-auth-warning ACL SETUSER exporter on ">$$REDIS_EXPORTER_PASSWORD" '~*' '+@read' '+@connection' '+info' '+client' '+config|get' '+slowlog' '+memory' '+latency' '+command' '+dbsize'
    logging: *default-logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis:6379
      REDIS_USER: exporter
      REDIS_PASSWORD: ${REDIS_EXPORTER_PASSWORD:?REDIS_EXPORTER_PASSWORD is required}
    ports:
      - "127.0.0.1:9121:9121"
    depends_on:
      redis-exporter-init:
        condition: service_completed_successfully
    logging: *default-logging

  postgres-exporter-init:
    image: postgres:16
    restart: "no"
    depends_on:
      pgvector:
        condition: service_healthy
    environment:
      PGPASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}
      PG_USERNAME: ${PG_USERNAME:-aiagent}
      PG_EXPORTER_PASSWORD: ${PG_EXPORTER_PASSWORD:?PG_EXPORTER_PASSWORD is required}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        psql -h pgvector -U "$$PG_USERNAME" -d vector -v ON_ERROR_STOP=1 -c "CREATE ROLE exporter LOGIN;" 2>/dev/null || true
        psql -h pgvector -U "$$PG_USERNAME" -d vector -v ON_ERROR_STOP=1 -c "ALTER ROLE exporter WITH LOGIN PASSWORD '$$PG_EXPORTER_PASSWORD';"
        psql -h pgvector -U "$$PG_USERNAME" -d vector -v ON_ERROR_STOP=1 -c "GRANT pg_monitor TO exporter; GRANT CONNECT ON DATABASE vector TO exporter;"
    logging: *default-logging

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://exporter:${PG_EXPORTER_PASSWORD:?PG_EXPORTER_PASSWORD is required}@pgvector:5432/vector?sslmode=disable
    ports:
      - "127.0.0.1:9187:9187"
    depends_on:
      postgres-exporter-init:
        condition: service_completed_successfully
    logging: *default-logging

  loki:
    image: grafana/loki:3.2.1
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    user: "0:0"
    volumes:
      - ./deploy/observability/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_BIND:-127.0.0.1}:${LOKI_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging

  promtail:
    image: grafana/promtail:3.2.1
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./deploy/observability/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/promtail
    depends_on:
      loki:
        condition: service_healthy
    logging: *default-logging

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./deploy/observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "${TEMPO_BIND:-127.0.0.1}:${TEMPO_PORT:-3200}:3200"
    logging: *default-logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./deploy/observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "${OTEL_GRPC_BIND:-127.0.0.1}:${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_BIND:-127.0.0.1}:${OTEL_HTTP_PORT:-4318}:4318"
    depends_on:
      - tempo
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      TZ: Asia/Shanghai
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *default-logging

volumes:
  mysql-data:
  redis-data:
  pgvector-data:
  minio-data:
  platform-config:
  ollama-data:
  prometheus-data:
  loki-data:
  promtail-positions:
  tempo-data:
  grafana-data:
  alertmanager-data:
  alert-relay-state:
  metrics-token:
