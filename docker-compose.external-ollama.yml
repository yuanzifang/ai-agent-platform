# 宿主机已有 Ollama 时的降级编排。
# 用法（宿主机 11434 可访问，且已 pull bge-m3）：
#   docker compose -f docker-compose.yml \
#     -f docker-compose.external-minio.yml \
#     -f docker-compose.external-ollama.yml up -d
services:
  ollama:
    image: busybox:1.36
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "true"]

  backend:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_ENDPOINT: ${OLLAMA_EXTERNAL_ENDPOINT:-http://host.docker.internal:11434}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_ENDPOINT: ${EMBEDDING_EXTERNAL_ENDPOINT:-http://host.docker.internal:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
