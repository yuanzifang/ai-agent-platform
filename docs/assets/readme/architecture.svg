nt-size="15" fill="#5d6b82">metadata / audit</text><rect x="1330" y="245" width="210" height="90" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1435.0" y="279" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#172033">Redis</text><text x="1435.0" y="307" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5d6b82">live state / cache</text><rect x="1330" y="370" width="210" height="90" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1435.0" y="404" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#172033">PgVector</text><text x="1435.0" y="432" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5d6b82">BGE-M3 embeddings</text><rect x="1330" y="495" width="210" height="90" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1435.0" y="529" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#172033">MinIO</text><text x="1435.0" y="557" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5d6b82">documents / files</text><rect x="100" y="620" width="330" height="110" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="265.0" y="654" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#172033">Model Providers</text><text x="265.0" y="682" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5d6b82">Ollama · DeepSeek</text><text x="265.0" y="705" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5d6b82">OpenAI-compatible APIs</text><rect x="500" y="620" width="330" height="110" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="665.0" y="654" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#172033">Tool Ecosystem</text><text x="665.0" y="682" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5d6b82">MCP servers · HTTP tools</text><text x="665.0" y="705" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5d6b82">built-in tools</text><rect x="900" y="620" width="330" height="110" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1065.0" y="654" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#172033">Observability Stack</text><text x="1065.0" y="682" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5d6b82">Prometheus · Grafana</text><text x="1065.0" y="705" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5d6b82">Loki · Tempo · Alertmanager</text><text x="60" y="865" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5d6b82">Request path: Browser → Nginx → Agent Harness → Retrieval / Model / Tools → SSE response → Trace and persistence.</text><text x="60" y="895" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5d6b82">All tenant-scoped requests carry X-Tenant-Id; platform administrators select a tenant before entering the workspace.</text>
