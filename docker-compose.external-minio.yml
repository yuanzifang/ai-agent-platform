# 宿主机已有 MinIO 时的降级编排：官方 minio/minio 镜像自 2025 起停止匿名分发，
# Docker Hub / quay 拉取返回 403/401。该 override 用 busybox 占位，后端改连宿主机 MinIO。
# 用法（本机已启动 MinIO 且 9000 可访问）：
#   MINIO_EXTERNAL_ENDPOINT=http://host.docker.internal:9000 \
#   docker compose -f docker-compose.yml -f docker-compose.external-minio.yml up -d
# MYSQL/Redis/PgVector/Ollama/Backend/Frontend/Prometheus/Grafana 仍全部由 Compose 启动。
services:
  minio:
    image: busybox:1.36
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "true"]

  minio-init:
    image: busybox:1.36
    entrypoint: ["/bin/true"]

  backend:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MINIO_ENDPOINT: ${MINIO_EXTERNAL_ENDPOINT:-http://host.docker.internal:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
