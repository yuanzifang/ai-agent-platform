# S3/MinIO Tempo 对象存储模板；替换凭据后使用，不要提交真实 key。
server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 10s

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: s3
    s3:
      bucket: tempo-traces
      endpoint: ${MINIO_ENDPOINT}
      access_key: ${MINIO_ROOT_USER}
      secret_key: ${MINIO_ROOT_PASSWORD}
      insecure: true
