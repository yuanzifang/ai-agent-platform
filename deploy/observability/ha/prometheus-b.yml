# 本机原生启动 backend（非 Docker Compose）时的 Prometheus 配置。
# Docker Desktop/Colima 使用 host.docker.internal 访问宿主机。
global:
  external_labels:
    replica: b
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["host.docker.internal:19093"]

scrape_configs:
  - job_name: ai-agent-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: mysqld
    static_configs:
      - targets: ["host.docker.internal:19104"]
  - job_name: redis
    static_configs:
      - targets: ["host.docker.internal:19121"]
  - job_name: postgres
    static_configs:
      - targets: ["host.docker.internal:19187"]
