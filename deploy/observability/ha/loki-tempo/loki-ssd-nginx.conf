upstream loki_write {
    server loki-write-1:3100;
    server loki-write-2:3100;
    server loki-write-3:3100;
}
upstream loki_read {
    server loki-read-1:3100;
    server loki-read-2:3100;
}
server {
    listen 8080;
    location = /healthz { return 200 "ok\n"; }
    location /loki/api/v1/push { proxy_pass http://loki_write; proxy_set_header Host $host; }
    location / { proxy_pass http://loki_read; proxy_set_header Host $host; }
}
