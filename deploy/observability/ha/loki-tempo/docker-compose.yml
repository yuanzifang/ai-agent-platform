# Loki 3 节点单进程集群：memberlist + S3 + nginx LB（本地验证用）。
name: aap-loki-ha
services:
  loki-1:
    image: grafana/loki:3.2.1
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ../../../../runtime/observability/loki-ha/loki-1.yml:/etc/loki/loki.yml:ro
      - loki-1-data:/loki
    ports: ["127.0.0.1:23101:3100", "127.0.0.1:23111:7946"]
  loki-2:
    image: grafana/loki:3.2.1
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ../../../../runtime/observability/loki-ha/loki-2.yml:/etc/loki/loki.yml:ro
      - loki-2-data:/loki
    ports: ["127.0.0.1:23102:3100", "127.0.0.1:23112:7946"]
  loki-3:
    image: grafana/loki:3.2.1
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ../../../../runtime/observability/loki-ha/loki-3.yml:/etc/loki/loki.yml:ro
      - loki-3-data:/loki
    ports: ["127.0.0.1:23103:3100", "127.0.0.1:23113:7946"]
  loki-lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./loki-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:23100:8080"]
    depends_on: [loki-1, loki-2, loki-3]
volumes:
  loki-1-data:
  loki-2-data:
  loki-3-data:
