global:
  resolve_timeout: 5m

route:
  receiver: platform-webhook
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h

receivers:
  - name: platform-webhook
    webhook_configs:
      # 独立中继（不依赖后端）；后端宕机时 AiAgentBackendDown 仍可送达。
      - url: http://alert-relay:8080/alertmanager
        send_resolved: true
        max_alerts: 20
