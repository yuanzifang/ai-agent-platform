global:
  resolve_timeout: 5m

# 值班路由：按 alertname+severity 分组，5 分钟内的同组告警合并推送；
# 令牌须与后端 ALERT_RECEIVER_TOKEN 一致，生产环境务必替换默认值
route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: ops

receivers:
  - name: ops
    webhook_configs:
      - url: http://backend:8080/api/v1/ops/alerts/webhook
        send_resolved: true
        http_config:
          http_headers:
            X-Alert-Token:
              values: ["change-me-in-production"]
