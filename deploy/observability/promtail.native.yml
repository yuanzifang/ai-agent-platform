server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 容器日志文件，不访问 Docker API。
  - job_name: docker-files
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - docker: {}

  # 宿主机原生启动的 backend；logs/backend.log 由启动脚本追加写入
  - job_name: native-backend
    static_configs:
      - targets: [localhost]
        labels:
          job: native-backend
          service_name: backend
          container: aap-backend-native
          __path__: /var/log/aap/backend.log
