global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: ai-agent-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: mysqld
    static_configs:
      - targets: ["host.docker.internal:19104"]

  - job_name: redis
    static_configs:
      - targets: ["host.docker.internal:19121"]

  - job_name: postgres
    static_configs:
      - targets: ["host.docker.internal:19187"]
