apiVersion: v1
kind: Namespace
metadata:
  name: aap-monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aap-prometheus
  namespace: aap-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aap-prometheus-kubelet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:kubelet-api-admin
subjects:
  - kind: ServiceAccount
    name: aap-prometheus
    namespace: aap-monitoring
