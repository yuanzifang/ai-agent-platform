apiVersion: v1
kind: Service
metadata:
  name: backend-metrics
  namespace: aap
  labels:
    app.kubernetes.io/part-of: ai-agent-platform
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: backend
    app.kubernetes.io/instance: aap
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-metrics
  namespace: aap-data
  labels:
    app.kubernetes.io/part-of: aap-data
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      nodePort: 30306
---
apiVersion: v1
kind: Service
metadata:
  name: pg-metrics
  namespace: aap-data
  labels:
    app.kubernetes.io/part-of: aap-data
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: pgvector
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      nodePort: 30543
---
apiVersion: v1
kind: Service
metadata:
  name: redis-metrics
  namespace: aap-data
  labels:
    app.kubernetes.io/part-of: aap-data
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      nodePort: 30637
---
apiVersion: v1
kind: Service
metadata:
  name: minio-metrics
  namespace: aap-data
  labels:
    app.kubernetes.io/part-of: aap-data
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
      nodePort: 30900
