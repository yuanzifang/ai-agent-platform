# 默认值面向生产：依赖 MySQL/Redis/PgVector/MinIO/Ollama 使用外部或集群内独立服务。
# 全量单机环境请用根目录 docker-compose.yml。

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []
serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

podAnnotations: {}
commonLabels: {}

backend:
  image:
    repository: ghcr.io/example/ai-agent-platform-backend
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 2
  minReadySeconds: 5
  progressDeadlineSeconds: 300
  preStopSleepSeconds: 10
  javaOpts: "-Xms512m -Xmx2g"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 3Gi
  service:
    type: ClusterIP
    port: 8080
    # SSE 停止/重生成依赖单实例内存状态；多副本时用 ClientIP 会话保持
    sessionAffinity: ClientIP
    sessionAffinityTimeoutSeconds: 10800
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
          - type: Percent
            value: 100
            periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Percent
            value: 50
            periodSeconds: 60
  pdb:
    enabled: true
    minAvailable: 1
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

frontend:
  image:
    repository: ghcr.io/example/ai-agent-platform-frontend
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 2
  minReadySeconds: 5
  progressDeadlineSeconds: 300
  preStopSleepSeconds: 10
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 80
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1
  securityContext: {}

# 非敏感运行时配置（写入 ConfigMap）
config:
  timezone: Asia/Shanghai
  mysqlHost: mysql
  mysqlPort: "3306"
  mysqlDatabase: ai_agent_platform
  mysqlUsername: aiagent
  redisHost: redis
  redisPort: "6379"
  pgUrl: jdbc:postgresql://pgvector:5432/vector
  pgUsername: aiagent
  minioEndpoint: http://minio:9000
  ollamaEndpoint: http://ollama:11434
  # 云端可改为 openai/其他 OpenAI 兼容 embeddings 服务，并移除 Ollama
  embeddingProvider: ollama
  embeddingEndpoint: http://ollama:11434
  deepseekBaseUrl: https://api.deepseek.com
  toolAllowPrivate: "false"
  alertWebhookEnabled: "false"
  alertWebhookUrl: ""
  alertWebhookSecret: ""
  # 入站 /internal/alertmanager 共享 token；生产建议设置
  alertWebhookInternalToken: ""
  alertWebhookEnv: "prod"
  alertWebhookKeyword: "告警"
  alertRelayBaseUrl: ""
  alertWebhookType: "auto"
  alertEmailEnabled: "false"
  alertEmailFrom: ""
  alertEmailTo: ""
  alertSmsEnabled: "false"
  alertSmsEndpoint: "dysmsapi.aliyuncs.com"
  alertSmsSignName: ""
  alertSmsTemplateCode: ""
  alertSmsPhoneNumbers: ""
  # /actuator/prometheus 抓取 token；空=兼容旧部署
  metricsScrapeToken: ""
  apiDocsEnabled: "false"
  toolAllowedHosts: ""
  # 生产必须改为对外域名（OAuth 回调 / 前端跳转）
  publicBase: "http://localhost:8080"
  frontendBase: "http://localhost:5173"
  # 生产默认：弱默认密钥熔断 + HttpOnly Secure Cookie（需配 TLS）
  appEnv: "production"
  authCookieSecure: "true"
  otelEnabled: "false"
  otelEndpoint: "http://otel-collector:4318"
  rateLimitPerMinute: "60"
  moderationPromptInjectionEnabled: "true"
  moderationPromptInjectionBlockScore: "2"
  skillScriptEnabled: "false"
  # 容器沙箱需后端容器挂载 /var/run/docker.sock 并安装 docker CLI，未挂载前保持 process
  skillScriptRuntime: "process"
  asrEnabled: "false"
  asrEndpoint: ""
  smtpHost: ""
  smtpPort: "587"
  smtpAuth: "true"
  smtpTls: "true"

# 敏感配置（写入 Secret 或引用 existingSecret）
# existingSecret 非空时不再创建 Secret，Secret 需包含下列同名 key。
secrets:
  existingSecret: ""
  mysqlPassword: ""
  redisPassword: ""
  pgPassword: ""
  minioAccessKey: "aiagent"
  minioSecretKey: ""
  jwtSecret: ""
  aesKey: ""
  deepseekApiKey: "sk-not-configured"
  platformAdminPassword: ""
  smtpUsername: ""
  smtpPassword: ""
  alertSmsAccessKeyId: ""
  alertSmsAccessKeySecret: ""
  alertRelayAckToken: ""

# 可选：把平台基础设施配置以只读 Secret 挂载到 /app/config/application-platform.yml。
# Secret 必须包含 key: application-platform.yml（建议使用平台页导出的加密文件）。
# 多副本下平台页无法写只读挂载，配置变更应更新 Secret 后滚动重启。
platformInfra:
  existingSecret: ""

# 可选：ES 知识索引每日快照 CronJob。ES 节点需配置 path.repo，且 location 必须与之一致。
# authSecret 是可选的 Secret 名称，可提供 ELASTICSEARCH_API_KEY 或 ELASTICSEARCH_USERNAME/PASSWORD。
esSnapshot:
  enabled: false
  schedule: "10 3 * * *"
  image:
    repository: python
    tag: "3.12-alpine"
    pullPolicy: IfNotPresent
  elasticsearchUrl: "http://elasticsearch:9200"
  repository: "aap_local"
  location: "/usr/share/elasticsearch/snapshots"
  prefix: "aap-knowledge-"
  keep: 14
  authSecret: ""
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # SSE 停止/重生成依赖会话保持；多副本下必须开启
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/session-cookie-name: AIAGENTSESSION
    nginx.ingress.kubernetes.io/session-cookie-max-age: "10800"
    nginx.ingress.kubernetes.io/session-cookie-path: /
    nginx.ingress.kubernetes.io/session-cookie-samesite: Lax
  hosts:
    - host: ai-agent.example.com
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /mcp
          pathType: Exact
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
  tls: []

networkPolicy:
  enabled: false
  ingressNamespace: ingress-nginx
