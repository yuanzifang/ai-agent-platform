apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-agent-platform.frontend.fullname" . }}-nginx
  labels:
    {{- include "ai-agent-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 20m;

        location = /api/actuator/health {
            proxy_pass http://{{ include "ai-agent-platform.backend.fullname" . }}:{{ .Values.backend.service.port }}/actuator/health;
            proxy_set_header Host $host;
        }

        location /api/ {
            proxy_pass http://{{ include "ai-agent-platform.backend.fullname" . }}:{{ .Values.backend.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 平台作为 MCP Server（Claude Desktop / Cursor 直连）
        location = /mcp {
            proxy_pass http://{{ include "ai-agent-platform.backend.fullname" . }}:{{ .Values.backend.service.port }}/mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
