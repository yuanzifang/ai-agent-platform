{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-agent-platform.secretName" . }}
  labels:
    {{- include "ai-agent-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  MYSQL_PASSWORD: {{ required "secrets.mysqlPassword is required (or set secrets.existingSecret)" .Values.secrets.mysqlPassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  PG_PASSWORD: {{ required "secrets.pgPassword is required (or set secrets.existingSecret)" .Values.secrets.pgPassword | quote }}
  MINIO_ACCESS_KEY: {{ required "secrets.minioAccessKey is required (or set secrets.existingSecret)" .Values.secrets.minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ required "secrets.minioSecretKey is required (or set secrets.existingSecret)" .Values.secrets.minioSecretKey | quote }}
  JWT_SECRET: {{ required "secrets.jwtSecret is required (>=32 chars; or set secrets.existingSecret)" .Values.secrets.jwtSecret | quote }}
  AES_KEY: {{ required "secrets.aesKey is required (>=32 chars; or set secrets.existingSecret)" .Values.secrets.aesKey | quote }}
  DEEPSEEK_API_KEY: {{ .Values.secrets.deepseekApiKey | quote }}
  PLATFORM_ADMIN_PASSWORD: {{ required "secrets.platformAdminPassword is required (or set secrets.existingSecret)" .Values.secrets.platformAdminPassword | quote }}
  SMTP_USERNAME: {{ .Values.secrets.smtpUsername | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
{{- end }}
