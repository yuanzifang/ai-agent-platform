apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-agent-platform.backend.fullname" . }}
  labels:
    {{- include "ai-agent-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    # Traefik 的 sticky 注解必须放在 Service 上；nginx ingress 会忽略
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: AIAGENTSESSION
    traefik.ingress.kubernetes.io/service.sticky.cookie.secure: {{ if .Values.ingress.tls }}"true"{{ else }}"false"{{ end }}
    traefik.ingress.kubernetes.io/service.sticky.cookie.httpOnly: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.sameSite: Lax
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ai-agent-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- if eq .Values.backend.service.sessionAffinity "ClientIP" }}
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: {{ .Values.backend.service.sessionAffinityTimeoutSeconds }}
  {{- end }}
