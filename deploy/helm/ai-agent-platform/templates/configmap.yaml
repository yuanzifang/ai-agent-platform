apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-agent-platform.fullname" . }}-config
  labels:
    {{- include "ai-agent-platform.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: "k8s"
  SERVER_FORWARD_HEADERS_STRATEGY: "framework"
  MYSQL_HOST: {{ .Values.config.mysqlHost | quote }}
  MYSQL_PORT: {{ .Values.config.mysqlPort | quote }}
  MYSQL_USERNAME: {{ .Values.config.mysqlUsername | quote }}
  REDIS_HOST: {{ .Values.config.redisHost | quote }}
  REDIS_PORT: {{ .Values.config.redisPort | quote }}
  PG_URL: {{ .Values.config.pgUrl | quote }}
  PG_USERNAME: {{ .Values.config.pgUsername | quote }}
  MINIO_ENDPOINT: {{ .Values.config.minioEndpoint | quote }}
  OLLAMA_ENDPOINT: {{ .Values.config.ollamaEndpoint | quote }}
  EMBEDDING_PROVIDER: {{ .Values.config.embeddingProvider | quote }}
  EMBEDDING_ENDPOINT: {{ .Values.config.embeddingEndpoint | quote }}
  DEEPSEEK_BASE_URL: {{ .Values.config.deepseekBaseUrl | quote }}
  TOOL_ALLOW_PRIVATE: {{ .Values.config.toolAllowPrivate | quote }}
  TOOL_ALLOWED_HOSTS: {{ .Values.config.toolAllowedHosts | quote }}
  ALERT_WEBHOOK_ENABLED: {{ .Values.config.alertWebhookEnabled | quote }}
  ALERT_WEBHOOK_URL: {{ .Values.config.alertWebhookUrl | quote }}
  ALERT_WEBHOOK_SECRET: {{ .Values.config.alertWebhookSecret | quote }}
  ALERT_WEBHOOK_ENV: {{ .Values.config.alertWebhookEnv | quote }}
  API_DOCS_ENABLED: {{ .Values.config.apiDocsEnabled | quote }}
  APP_PUBLIC_BASE: {{ .Values.config.publicBase | quote }}
  APP_FRONTEND_BASE: {{ .Values.config.frontendBase | quote }}
  APP_ENV: {{ .Values.config.appEnv | quote }}
  AUTH_COOKIE_SECURE: {{ .Values.config.authCookieSecure | quote }}
  OTEL_ENABLED: {{ .Values.config.otelEnabled | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelEndpoint | quote }}
  RATE_LIMIT_PER_MINUTE: {{ .Values.config.rateLimitPerMinute | quote }}
  MODERATION_PROMPT_INJECTION_ENABLED: {{ .Values.config.moderationPromptInjectionEnabled | quote }}
  MODERATION_PROMPT_INJECTION_BLOCK_SCORE: {{ .Values.config.moderationPromptInjectionBlockScore | quote }}
  SKILL_SCRIPT_ENABLED: {{ .Values.config.skillScriptEnabled | quote }}
  SKILL_SCRIPT_RUNTIME: {{ .Values.config.skillScriptRuntime | quote }}
  ASR_ENABLED: {{ .Values.config.asrEnabled | quote }}
  ASR_ENDPOINT: {{ .Values.config.asrEndpoint | quote }}
  SMTP_HOST: {{ .Values.config.smtpHost | quote }}
  SMTP_PORT: {{ .Values.config.smtpPort | quote }}
  SMTP_AUTH: {{ .Values.config.smtpAuth | quote }}
  SMTP_TLS: {{ .Values.config.smtpTls | quote }}
