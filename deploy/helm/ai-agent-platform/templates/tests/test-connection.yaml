apiVersion: v1
kind: Pod
metadata:
  name: {{ include "ai-agent-platform.fullname" . }}-test-connection
  labels:
    {{- include "ai-agent-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command:
        - sh
        - -c
        - |
          curl -fsS http://{{ include "ai-agent-platform.backend.fullname" . }}:{{ .Values.backend.service.port }}/actuator/health
          curl -fsS http://{{ include "ai-agent-platform.frontend.fullname" . }}:{{ .Values.frontend.service.port }}/healthz
