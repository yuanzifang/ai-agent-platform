# 检索 HA 的 Kubernetes 模板（独立于平台 Chart；生产请按集群容量/存储类调整）。
apiVersion: v1
kind: Service
metadata:
  name: es-headless
  labels: {app: search-ha, component: elasticsearch}
spec:
  clusterIP: None
  selector: {app: search-ha, component: elasticsearch}
  ports:
    - {name: http, port: 9200, targetPort: 9200}
    - {name: transport, port: 9300, targetPort: 9300}
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  labels: {app: search-ha, component: elasticsearch}
spec:
  selector: {app: search-ha, component: elasticsearch}
  ports:
    - {name: http, port: 9200, targetPort: 9200}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: es
  labels: {app: search-ha, component: elasticsearch}
spec:
  serviceName: es-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: search-ha, component: elasticsearch}
  template:
    metadata:
      labels: {app: search-ha, component: elasticsearch}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
          env:
            - {name: cluster.name, value: aap-ha}
            - {name: discovery.seed_hosts, value: "es-0.es-headless,es-1.es-headless,es-2.es-headless"}
            - {name: cluster.initial_master_nodes, value: "es-0,es-1,es-2"}
            - {name: xpack.security.enabled, value: "false"}
            - {name: ES_JAVA_OPTS, value: "-Xms512m -Xmx512m"}
          ports:
            - {name: http, containerPort: 9200}
            - {name: transport, containerPort: 9300}
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /usr/share/elasticsearch/data}
          readinessProbe:
            httpGet: {path: "/_cluster/health?wait_for_status=yellow", port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 60
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 20Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant-headless
  labels: {app: search-ha, component: qdrant}
spec:
  clusterIP: None
  selector: {app: search-ha, component: qdrant}
  ports:
    - {name: http, port: 6333, targetPort: 6333}
    - {name: grpc, port: 6334, targetPort: 6334}
    - {name: p2p, port: 6335, targetPort: 6335}
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  labels: {app: search-ha, component: qdrant}
spec:
  selector: {app: search-ha, component: qdrant}
  ports:
    - {name: http, port: 6333, targetPort: 6333}
    - {name: grpc, port: 6334, targetPort: 6334}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  labels: {app: search-ha, component: qdrant}
spec:
  serviceName: qdrant-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: search-ha, component: qdrant}
  template:
    metadata:
      labels: {app: search-ha, component: qdrant}
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ "$HOSTNAME" = "qdrant-0" ]; then
                exec ./entrypoint.sh --uri "http://qdrant-0.qdrant-headless:6335"
              else
                exec ./entrypoint.sh --bootstrap "http://qdrant-0.qdrant-headless:6335"
              fi
          env:
            - {name: QDRANT__CLUSTER__ENABLED, value: "true"}
            - {name: QDRANT__CLUSTER__P2P__PORT, value: "6335"}
          ports:
            - {name: http, containerPort: 6333}
            - {name: grpc, containerPort: 6334}
            - {name: p2p, containerPort: 6335}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /qdrant/storage}
          readinessProbe:
            httpGet: {path: /collections, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 10Gi}
