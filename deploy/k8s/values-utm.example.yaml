# 示例模板：将 <utm-host-ip>（UTM/虚拟机宿主）与 <mac-host-ip>（Mac 本机）替换为实际地址。
imagePullSecrets: []
backend:
  image:
    repository: aap/backend
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  pdb:
    enabled: true
    minAvailable: 1
frontend:
  image:
    repository: aap/frontend
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: NodePort
    port: 80
    nodePort: 30080
  pdb:
    enabled: true
    minAvailable: 1
config:
  timezone: Asia/Shanghai
  mysqlHost: <utm-host-ip>
  mysqlPort: "3306"
  mysqlDatabase: ai_agent_platform
  mysqlUsername: root
  redisHost: <utm-host-ip>
  redisPort: "6379"
  pgUrl: jdbc:postgresql://<utm-host-ip>:5432/vector
  pgUsername: aap_vector_app
  minioEndpoint: http://<utm-host-ip>:9000
  ollamaEndpoint: http://<mac-host-ip>:11434
  embeddingProvider: ollama
  embeddingEndpoint: http://<mac-host-ip>:11434
  appEnv: development
  authCookieSecure: "false"
  publicBase: http://<utm-host-ip>:18080
  frontendBase: http://<utm-host-ip>:18080
  extraEnv:
    ELASTICSEARCH_URL: http://<utm-host-ip>:9200
    QDRANT_URL: http://<utm-host-ip>:6333
secrets:
  existingSecret: aap-secrets
ingress:
  enabled: false
networkPolicy:
  enabled: false
esSnapshot:
  enabled: false
