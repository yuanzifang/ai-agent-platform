apiVersion: v1
kind: Service
metadata:
  name: aap-agent-gateway
  namespace: aap
  labels:
    app.kubernetes.io/name: agent-gateway
    app.kubernetes.io/part-of: ai-agent-platform
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: agent-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aap-agent-gateway
  namespace: aap
  labels:
    app.kubernetes.io/name: agent-gateway
    app.kubernetes.io/part-of: ai-agent-platform
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-gateway
        app.kubernetes.io/part-of: ai-agent-platform
    spec:
      containers:
        - name: agent-gateway
          image: aap/agent-gateway:1
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: aap-agent-secrets
          env:
            - name: AGENT_SLUG
              value: agent-1
            - name: PLATFORM_BASE
              value: http://aap-ai-agent-platform-backend.aap.svc.cluster.local:8080
            - name: CORS_ORIGIN
              value: "*"
            - name: RATE_LIMIT_PER_MIN
              value: "60"
            - name: RATE_BURST
              value: "20"
            - name: CALLER_QUOTA_DAILY
              value: "0"
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
