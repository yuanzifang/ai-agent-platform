spring:
  application:
    name: ai-agent-platform
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_TLS:true}
      mail.smtp.starttls.required: ${SMTP_TLS:true}
  ai:
    openai:
      # DeepSeek 走 OpenAI 兼容协议；Key 后补，占位值保证未配置时应用可启动
      api-key: ${DEEPSEEK_API_KEY:sk-not-configured}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ai_agent_platform}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      # 100 并发压测显示单纯放大连接池未改善排队；默认保持 10，按实际 DB/上游 profiling 调整
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

request:
  timing:
    # 仅压测/定位时开启；首字节超过 slow-ms 打 WARN，默认无行为变化
    enabled: ${REQUEST_TIMING_ENABLED:false}
    slow-ms: ${REQUEST_TIMING_SLOW_MS:1000}

tool:
  input-validation:
    # 模型入参校验失败时回传结构化 tool result；达到上限后 retryable=false
    max-attempts: ${TOOL_INPUT_VALIDATION_MAX_ATTEMPTS:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ai-agent-platform
  health:
    mail:
      # 未配置 SMTP 时避免整体健康检查 DOWN；配置 SMTP 后可设 SMTP_HEALTH_ENABLED=true
      enabled: ${SMTP_HEALTH_ENABLED:false}

# ---- 平台配置（架构 10.7）----
security:
  network:
    # 生产建议 TOOL_ALLOW_PRIVATE=false，并可配置出口域名白名单（逗号分隔）
    allow-private: ${TOOL_ALLOW_PRIVATE:true}
    allowed-hosts: ${TOOL_ALLOWED_HOSTS:}
  # 租户级接口限流（次/分钟，0=关闭；需求 3.22）
  rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:60}
  # 登录失败锁定（需求 3.25(1)）
  login:
    max-failures: ${LOGIN_MAX_FAILURES:5}
    lock-minutes: ${LOGIN_LOCK_MINUTES:15}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    # 短期 Access Token（默认 30 分钟），续期走 HttpOnly Refresh Cookie
    expiry-seconds: ${JWT_EXPIRY_SECONDS:1800}
  auth:
    # Refresh Token 仅通过 HttpOnly Cookie 下发；生产必须 HTTPS 并设为 true
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    refresh-cookie-max-age-seconds: ${AUTH_REFRESH_COOKIE_MAX_AGE:604800}
  aes-key: ${AES_KEY:}          # 凭证加密密钥，M2 使用

llm:
  context:
    # 模型未配置 context_window 时的默认窗口；预留输出 Token；超限启用历史摘要压缩
    default-window: ${LLM_CONTEXT_DEFAULT_WINDOW:32768}
    reserve-tokens: ${LLM_CONTEXT_RESERVE_TOKENS:2048}
    compress-enabled: ${LLM_CONTEXT_COMPRESS:true}
  deepseek:
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}   # 后补；为空时模型相关功能返回「未配置」

embedding:
  # 本地默认 Ollama；云端可改为任意 OpenAI 兼容 embeddings 服务（provider 非 ollama 时跳过 /api/tags 探测）
  provider: ${EMBEDDING_PROVIDER:ollama}
  endpoint: ${EMBEDDING_ENDPOINT:http://localhost:11434}
  # 默认偏好 bge-m3（中文效果更好）；启动时探测 Ollama，未安装则自动回退 nomic-embed-text
  model: ${EMBEDDING_MODEL:bge-m3}
  dimensions: ${EMBEDDING_DIMENSIONS:1024}
  # 远程 embedding API 可设 2-4 并发；本地 Ollama 单卡建议保持 1
  batch-concurrency: ${EMBEDDING_BATCH_CONCURRENCY:1}
  # 单条检索问句 embedding 进程内缓存；0 关闭
  query-cache-ttl-seconds: ${EMBEDDING_QUERY_CACHE_TTL_SECONDS:300}
  query-cache-max-entries: ${EMBEDDING_QUERY_CACHE_MAX_ENTRIES:2000}
  # embedding 向量缓存保留天数/最大条目数；每小时最多清理一次
  cache-ttl-days: ${EMBEDDING_CACHE_TTL_DAYS:30}
  cache-max-entries: ${EMBEDDING_CACHE_MAX_ENTRIES:100000}
  # 知识库可选的 embedding 模型及维度（需先在 Ollama 拉取对应模型）
  available:
    nomic-embed-text: 768
    bge-m3: 1024
    bge-large-zh-v1.5: 1024

skill:
  script:
    # 技能脚本执行（Python/JavaScript）
    enabled: ${SKILL_SCRIPT_ENABLED:true}
    # 隔离层级：process=进程级（OS 沙箱+语言禁网，本机开发）；docker=容器沙箱（生产/SaaS 开脚本时用）
    runtime: ${SKILL_SCRIPT_RUNTIME:process}
    python-command: ${SKILL_SCRIPT_PYTHON:python3}
    node-command: ${SKILL_SCRIPT_NODE:node}
    max-output-bytes: ${SKILL_SCRIPT_MAX_OUTPUT:65536}
    max-code-length: ${SKILL_SCRIPT_MAX_CODE:50000}
    docker:
      docker-bin: ${SKILL_SCRIPT_DOCKER_BIN:docker}
      python-image: ${SKILL_SCRIPT_PYTHON_IMAGE:python:3.12-alpine}
      node-image: ${SKILL_SCRIPT_NODE_IMAGE:node:22-alpine}
      memory: ${SKILL_SCRIPT_DOCKER_MEMORY:256m}
      cpus: ${SKILL_SCRIPT_DOCKER_CPUS:0.5}
      pids-limit: ${SKILL_SCRIPT_DOCKER_PIDS:64}

retrieval:
  rerank:
    # 通用 rerank HTTP（Jina/Cohere/BGE）。未配置时保持混合检索原顺序
    enabled: ${RERANK_ENABLED:false}
    endpoint: ${RERANK_ENDPOINT:}
    api-key: ${RERANK_API_KEY:}
    model: ${RERANK_MODEL:}
    top-n: ${RERANK_TOP_N:5}
  hybrid:
    # 向量 + MySQL ngram 全文检索的 RRF 融合；关闭后回到纯向量
    enabled: ${RETRIEVAL_HYBRID_ENABLED:true}
    keyword-weight: ${RETRIEVAL_KEYWORD_WEIGHT:0.35}

knowledge:
  parse:
    # 解析失败手动重试上限（需求 3.6.3(2)，默认 3 次，超限需人工介入）
    max-retries: ${KNOWLEDGE_PARSE_MAX_RETRIES:3}
    # 自动重试次数（指数退避 + 残留分段/向量补偿清理）
    auto-retries: ${KNOWLEDGE_PARSE_AUTO_RETRIES:2}
    # 超时 PARSING 回收：默认 6 小时未完成、每 30 分钟扫描、每次每租户最多 20 篇
    stale-minutes: ${KNOWLEDGE_PARSE_STALE_MINUTES:360}
    recovery-interval-ms: ${KNOWLEDGE_PARSE_RECOVERY_INTERVAL_MS:1800000}
    recovery-initial-delay-ms: ${KNOWLEDGE_PARSE_RECOVERY_INITIAL_DELAY_MS:300000}
    recovery-batch: ${KNOWLEDGE_PARSE_RECOVERY_BATCH:20}
  hash-backfill:
    # 历史文档 SHA256 定时回填：每批数量、扫描间隔
    batch: ${KNOWLEDGE_HASH_BACKFILL_BATCH:20}
    interval-ms: ${KNOWLEDGE_HASH_BACKFILL_INTERVAL_MS:600000}
    initial-delay-ms: ${KNOWLEDGE_HASH_BACKFILL_INITIAL_DELAY_MS:60000}
  vector-audit:
    # DONE 文档分段数/向量数一致性回查；每批数量、回查周期和重复检查间隔
    batch: ${KNOWLEDGE_VECTOR_AUDIT_BATCH:20}
    interval-ms: ${KNOWLEDGE_VECTOR_AUDIT_INTERVAL_MS:3600000}
    initial-delay-ms: ${KNOWLEDGE_VECTOR_AUDIT_INITIAL_DELAY_MS:120000}
    recheck-days: ${KNOWLEDGE_VECTOR_AUDIT_RECHECK_DAYS:7}
  outbox:
    # MySQL/PgVector 解析同步 outbox：批大小、扫描间隔、解析租约和重试窗口
    batch: ${KNOWLEDGE_OUTBOX_BATCH:10}
    interval-ms: ${KNOWLEDGE_OUTBOX_INTERVAL_MS:60000}
    initial-delay-ms: ${KNOWLEDGE_OUTBOX_INITIAL_DELAY_MS:60000}
    stale-minutes: ${KNOWLEDGE_OUTBOX_STALE_MINUTES:30}
    lease-minutes: ${KNOWLEDGE_OUTBOX_LEASE_MINUTES:5}
  upgrade:
    # 存量升级任务后台每批提交文档数、扫描间隔
    batch: ${KNOWLEDGE_UPGRADE_BATCH:10}
    interval-ms: ${KNOWLEDGE_UPGRADE_INTERVAL_MS:30000}
    initial-delay-ms: ${KNOWLEDGE_UPGRADE_INITIAL_DELAY_MS:30000}
  ocr:
    # 扫描版 PDF/图片 OCR（需安装 tesseract；chi_sim+eng 需对应语言包）
    enabled: ${KNOWLEDGE_OCR_ENABLED:false}
    command: ${KNOWLEDGE_OCR_COMMAND:tesseract}
    languages: ${KNOWLEDGE_OCR_LANGUAGES:chi_sim+eng}
    max-pages: ${KNOWLEDGE_OCR_MAX_PAGES:20}
    dpi: ${KNOWLEDGE_OCR_DPI:150}
    # 页面/内嵌图片 OCR 并发数；本地 CPU 建议 1-2，远程/多核可 2-4
    concurrency: ${KNOWLEDGE_OCR_CONCURRENCY:1}
    # 增强后有效字符少于此值时，再用原图跑一次并取更优结果
    retry-raw-min-chars: ${KNOWLEDGE_OCR_RETRY_RAW_MIN_CHARS:10}
    # OCR 结果进程内缓存条数；0 关闭
    cache-size: ${KNOWLEDGE_OCR_CACHE_SIZE:256}
    # 低对比度扫描件可选 Otsu 二值化
    binarize: ${KNOWLEDGE_OCR_BINARIZE:false}
    # 低质量 OCR 是否回退原图；off 可减少双跑，但会写入人工复核告警
    raw-fallback: ${KNOWLEDGE_OCR_RAW_FALLBACK:auto}
    # 持久化 OCR 缓存保留天数和每日清理时间
    cache-retention-days: ${KNOWLEDGE_OCR_CACHE_RETENTION_DAYS:30}
    cache-cleanup-cron: ${KNOWLEDGE_OCR_CACHE_CLEANUP_CRON:0 45 4 * * *}
  vision:
    # 可选图片多模态理解（本地 Ollama 视觉模型）；默认关闭
    enabled: ${KNOWLEDGE_VISION_ENABLED:false}
    endpoint: ${KNOWLEDGE_VISION_ENDPOINT:http://127.0.0.1:11434}
    model: ${KNOWLEDGE_VISION_MODEL:qwen3-vl:32b}
    timeout-seconds: ${KNOWLEDGE_VISION_TIMEOUT_SECONDS:600}
    max-images: ${KNOWLEDGE_VISION_MAX_IMAGES:3}

vector:
  # pgvector（默认）/ qdrant；milvus 保留扩展接口
  store: ${VECTOR_STORE:pgvector}
  qdrant:
    # 是否启用 Qdrant 适配器；知识库选择 QDRANT 前必须为 true
    enabled: ${VECTOR_QDRANT_ENABLED:false}
    url: ${QDRANT_URL:http://127.0.0.1:6333}
    api-key: ${QDRANT_API_KEY:}
    collection-prefix: ${QDRANT_COLLECTION_PREFIX:aap}

search:
  keyword:
    # 新知识库默认关键字后端：mysql / es
    provider: ${KEYWORD_SEARCH_PROVIDER:mysql}
  es:
    # 是否启用 ES 适配器；知识库选择 ES 前必须为 true
    enabled: ${SEARCH_ES_ENABLED:false}
    url: ${ELASTICSEARCH_URL:http://127.0.0.1:9200}
    index: ${ELASTICSEARCH_INDEX:aap_knowledge_chunks_v1}
    api-key: ${ELASTICSEARCH_API_KEY:}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}

pgvector:
  url: ${PG_URL:jdbc:postgresql://localhost:5432/vector}
  username: ${PG_USERNAME:wangpan}
  password: ${PG_PASSWORD:}
  pool-size: ${PGVECTOR_POOL_SIZE:8}
  hnsw:
    enabled: ${PGVECTOR_HNSW_ENABLED:true}
    concurrently: ${PGVECTOR_HNSW_CONCURRENTLY:true}
    partial:
      # 为达到阈值的知识库维护专用 partial HNSW，避免全局索引 + metadata 过滤退化
      enabled: ${PGVECTOR_HNSW_PARTIAL_ENABLED:true}
      min-rows: ${PGVECTOR_HNSW_PARTIAL_MIN_ROWS:10000}
      max-indexes: ${PGVECTOR_HNSW_PARTIAL_MAX_INDEXES:20}
      # 命中占比超过该值的知识库通常由全局 HNSW 更快，不再为其维护 partial 索引
      max-ratio: ${PGVECTOR_HNSW_PARTIAL_MAX_RATIO:0.4}
      # 默认不自动删除历史 partial 索引；确认存储/写放大预算后可开启
      prune: ${PGVECTOR_HNSW_PARTIAL_PRUNE:false}
      reconcile-interval-ms: ${PGVECTOR_HNSW_PARTIAL_RECONCILE_INTERVAL_MS:86400000}
      initial-delay-ms: ${PGVECTOR_HNSW_PARTIAL_INITIAL_DELAY_MS:300000}
  iterative-scan:
    enabled: ${PGVECTOR_ITERATIVE_SCAN_ENABLED:true}
  filtered-exact:
    # 低选择比（知识库命中占比）且总行数足够时走精确过滤，绕过 HNSW iterative scan 退化
    threshold: ${PGVECTOR_FILTERED_EXACT_THRESHOLD:0.25}
    min-rows: ${PGVECTOR_FILTERED_EXACT_MIN_ROWS:200000}
    # 小知识库才走物化精确排序；行数过大时精确排序会扫描/排序大量向量，交给 HNSW
    max-rows: ${PGVECTOR_FILTERED_EXACT_MAX_ROWS:50000}

asr:
  enabled: ${ASR_ENABLED:true}     # 本地 Qwen3-ASR（OpenAI 兼容协议，start-asr.sh 启动）
  type: local
  endpoint: ${ASR_ENDPOINT:http://127.0.0.1:8000}
  api-key: ${ASR_API_KEY:local}
  model: ${ASR_MODEL:/Users/wangpan/models/Qwen3-ASR-1.7B-8bit}
  timeout-ms: 60000

spring.servlet.multipart:
  max-file-size: 12MB
  max-request-size: 12MB

storage:
  # 大表月分区自动补齐（V48 创建初始分区；只补未来，不自动删历史）
  partition:
    enabled: ${PARTITION_MAINTENANCE_ENABLED:true}
    months-ahead: ${PARTITION_MONTHS_AHEAD:3}
    cron: ${PARTITION_MAINTENANCE_CRON:0 20 2 * * *}
  type: minio
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ai-agent-platform

# 内容审核 P0 规则（需求文档 3.21）：逗号分隔；第三方审核服务为 P1 可插拔
moderation:
  block-words: ${MODERATION_BLOCK_WORDS:赌博,毒品,代开发票}
  warn-words: ${MODERATION_WARN_WORDS:转账,汇款,银行卡号}
  # 启发式提示注入检测：单项 WARN，组合/绕过安全 BLOCK
  prompt-injection:
    enabled: ${MODERATION_PROMPT_INJECTION_ENABLED:true}
    block-score: ${MODERATION_PROMPT_INJECTION_BLOCK_SCORE:2}
  # 流式输出按块前置审核（字符），命中 BLOCK 立即停止下发
  stream:
    buffer-chars: ${MODERATION_STREAM_BUFFER_CHARS:40}
  # 第三方审核 HTTP 适配器（可指向云厂商网关/自建服务）
  http:
    enabled: ${MODERATION_HTTP_ENABLED:false}
    endpoint: ${MODERATION_HTTP_ENDPOINT:}
    api-key: ${MODERATION_HTTP_API_KEY:}
    timeout-ms: ${MODERATION_HTTP_TIMEOUT_MS:3000}

observability:
  trace:
    # 0~1；1=全量；错误/阻断默认始终保留
    sample-rate: ${TRACE_SAMPLE_RATE:1.0}
    always-sample-errors: ${TRACE_ALWAYS_SAMPLE_ERRORS:true}
    # 自动保留清理：默认 30 天，分批删除 Span/Trace
    retention-enabled: ${TRACE_RETENTION_ENABLED:true}
    retention-days: ${TRACE_RETENTION_DAYS:30}
    cleanup-batch: ${TRACE_CLEANUP_BATCH:1000}
    cleanup-cron: ${TRACE_CLEANUP_CRON:0 50 4 * * *}

otel:
  # 标准 OTLP Trace 导出（Jaeger/Tempo/Langfuse/Phoenix 等）
  enabled: ${OTEL_ENABLED:false}
  endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
  service-name: ${OTEL_SERVICE_NAME:ai-agent-platform}

mcp:
  resource:
    # resources/read / prompts/get 单次返回上限（字节/字符近似）
    max-bytes: ${MCP_RESOURCE_MAX_BYTES:1048576}

audit:
  # 审计保留：旧月分区先归档并写租户链锚点，再 DROP；手动触发走平台管理员接口
  archive:
    enabled: ${AUDIT_ARCHIVE_ENABLED:true}
    retention-days: ${AUDIT_RETENTION_DAYS:180}
    cron: ${AUDIT_ARCHIVE_CRON:0 10 4 * * *}

message:
  # 消息过期归档：整月分区先归档再 DROP；手动触发走平台管理员接口
  archive:
    enabled: ${MESSAGE_ARCHIVE_ENABLED:true}
    retention-days: ${MESSAGE_RETENTION_DAYS:90}
    cron: ${MESSAGE_ARCHIVE_CRON:0 40 3 * * *}

billing:
  # 余额低于该值时前端提示充值（需求 3.11）
  low-balance-threshold: ${BILLING_LOW_BALANCE_THRESHOLD:10}

agent:
  # Agent 容器部署（MVP：本机 Docker；发布后可把 Agent 跑成独立容器）
  deploy:
    # gateway=自研运行时镜像（推荐）；nginx=旧的 nginx 模板方案（保留兼容）
    runtime: ${AGENT_DEPLOY_RUNTIME:gateway}
    image: ${AGENT_DEPLOY_IMAGE:nginx:alpine}
    gateway-image: ${AGENT_DEPLOY_GATEWAY_IMAGE:aap/agent-gateway:1}
    # 主令牌的日调用配额，0=不限
    caller-quota-daily: ${AGENT_DEPLOY_CALLER_QUOTA_DAILY:0}
    # 额外调用方 Key：key1:日配额,key2:0（0=不限），注入运行时网关
    caller-keys: ${AGENT_DEPLOY_CALLER_KEYS:}
    port-start: ${AGENT_DEPLOY_PORT_START:19000}
    port-end: ${AGENT_DEPLOY_PORT_END:19999}
    # 默认副本数（1-5）；部署时可单独指定
    replicas: ${AGENT_DEPLOY_REPLICAS:1}
    # 多副本共享限流/配额/用量需要 Redis（容器内访问宿主机；留空则单副本内存统计）
    redis-url: ${AGENT_DEPLOY_REDIS_URL:redis://host.docker.internal:6379/0}
    # 容器端口绑定地址：0.0.0.0 允许局域网/Tailscale 访问，127.0.0.1 仅本机
    bind: ${AGENT_DEPLOY_BIND:0.0.0.0}
    # 运行时与 LB 容器的资源边界（Docker --cpus/--memory/--pids-limit）
    cpu-limit: ${AGENT_DEPLOY_CPU_LIMIT:1}
    memory-limit: ${AGENT_DEPLOY_MEMORY_LIMIT:512m}
    pids-limit: ${AGENT_DEPLOY_PIDS_LIMIT:256}
    # Docker json-file 日志轮转，避免容器长期运行占满磁盘
    log-max-size: ${AGENT_DEPLOY_LOG_MAX_SIZE:10m}
    log-max-file: ${AGENT_DEPLOY_LOG_MAX_FILE:3}
    # 容器内访问平台的地址（Docker Desktop 用 host.docker.internal；Linux 可换成宿主内网 IP）
    platform-base-url: ${AGENT_DEPLOY_PLATFORM_BASE:http://host.docker.internal:8080}
    # 对外地址前缀（如 https://agents.example.com），留空自动取本机 Tailscale/内网 IP
    public-base: ${AGENT_DEPLOY_PUBLIC_BASE:}
    # 模板目录（留空用 ~/.aap-agent-runtime），需要能被 Docker 挂载
    workdir: ${AGENT_DEPLOY_WORKDIR:}
    # 容器接口限流（每 IP，每分钟）与 CORS 允许来源
    rate-limit-per-min: ${AGENT_DEPLOY_RATE_LIMIT:60}
    rate-limit-burst: ${AGENT_DEPLOY_RATE_BURST:20}
    cors-origins: ${AGENT_DEPLOY_CORS_ORIGINS:*}
    docker-bin: ${AGENT_DEPLOY_DOCKER_BIN:docker}

app:
  # SSO 回调地址默认前端地址（/sso/callback）
  frontend-base: ${APP_FRONTEND_BASE:http://localhost:5173}
  # 后端对外地址（OAuth 2.1 回调）
  public-base: ${APP_PUBLIC_BASE:http://localhost:8080}
  mail:
    from: ${SMTP_FROM:no-reply@ai-agent.local}

# 开发者文档（生产置 api-docs.enabled=false 关闭对外暴露）
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# 运维告警推送（钉钉/企微/飞书群机器人 webhook；url 空则不推送）
alert:
  webhook:
    enabled: ${ALERT_WEBHOOK_ENABLED:false}
    url: ${ALERT_WEBHOOK_URL:}
    secret: ${ALERT_WEBHOOK_SECRET:}
    internal-token: ${ALERT_WEBHOOK_INTERNAL_TOKEN:}
    env: ${ALERT_WEBHOOK_ENV:dev}

chat:
  stream:
    # 流式快照心跳超过该阈值仍为 RUNNING，resume 判定生产实例已宕机
    stale-ms: ${CHAT_STREAM_STALE_MS:30000}

metrics:
  scrape:
    # 可选：/actuator/prometheus 抓取 token；空=兼容旧部署，生产建议设置
    token: ${METRICS_SCRAPE_TOKEN:}
