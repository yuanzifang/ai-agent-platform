spring:
  application:
    name: ai-agent-platform
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_TLS:true}
      mail.smtp.starttls.required: ${SMTP_TLS:true}
  ai:
    openai:
      # DeepSeek 走 OpenAI 兼容协议；Key 后补，占位值保证未配置时应用可启动
      api-key: ${DEEPSEEK_API_KEY:sk-not-configured}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/ai_agent_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ai-agent-platform
  health:
    mail:
      # 未配置 SMTP 时避免整体健康检查 DOWN；配置 SMTP 后可设 SMTP_HEALTH_ENABLED=true
      enabled: ${SMTP_HEALTH_ENABLED:false}

# ---- 平台配置（架构 10.7）----
security:
  network:
    # 生产建议 TOOL_ALLOW_PRIVATE=false，并可配置出口域名白名单（逗号分隔）
    allow-private: ${TOOL_ALLOW_PRIVATE:true}
    allowed-hosts: ${TOOL_ALLOWED_HOSTS:}
  # 租户级接口限流（次/分钟，0=关闭；需求 3.22）
  rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:60}
  # 登录失败锁定（需求 3.25(1)）
  login:
    max-failures: ${LOGIN_MAX_FAILURES:5}
    lock-minutes: ${LOGIN_LOCK_MINUTES:15}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    # 短期 Access Token（默认 30 分钟），续期走 HttpOnly Refresh Cookie
    expiry-seconds: ${JWT_EXPIRY_SECONDS:1800}
  auth:
    # Refresh Token 仅通过 HttpOnly Cookie 下发；生产必须 HTTPS 并设为 true
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    refresh-cookie-max-age-seconds: ${AUTH_REFRESH_COOKIE_MAX_AGE:604800}
  aes-key: ${AES_KEY:}          # 凭证加密密钥，M2 使用

llm:
  context:
    # 模型未配置 context_window 时的默认窗口；预留输出 Token；超限启用历史摘要压缩
    default-window: ${LLM_CONTEXT_DEFAULT_WINDOW:32768}
    reserve-tokens: ${LLM_CONTEXT_RESERVE_TOKENS:2048}
    compress-enabled: ${LLM_CONTEXT_COMPRESS:true}
  deepseek:
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}   # 后补；为空时模型相关功能返回「未配置」

embedding:
  provider: ollama
  endpoint: ${OLLAMA_ENDPOINT:http://localhost:11434}
  model: ${EMBEDDING_MODEL:nomic-embed-text}
  dimensions: ${EMBEDDING_DIMENSIONS:768}
  # 知识库可选的 embedding 模型及维度（需先在 Ollama 拉取对应模型）
  available:
    nomic-embed-text: 768
    bge-m3: 1024
    bge-large-zh-v1.5: 1024

skill:
  script:
    # 技能脚本执行（Python/JavaScript）；生产建议接入容器级隔离执行器
    enabled: ${SKILL_SCRIPT_ENABLED:true}
    python-command: ${SKILL_SCRIPT_PYTHON:python3}
    node-command: ${SKILL_SCRIPT_NODE:node}
    max-output-bytes: ${SKILL_SCRIPT_MAX_OUTPUT:65536}
    max-code-length: ${SKILL_SCRIPT_MAX_CODE:50000}

retrieval:
  rerank:
    # 通用 rerank HTTP（Jina/Cohere/BGE）。未配置时保持混合检索原顺序
    enabled: ${RERANK_ENABLED:false}
    endpoint: ${RERANK_ENDPOINT:}
    api-key: ${RERANK_API_KEY:}
    model: ${RERANK_MODEL:}
    top-n: ${RERANK_TOP_N:5}
  hybrid:
    # 向量 + MySQL ngram 全文检索的 RRF 融合；关闭后回到纯向量
    enabled: ${RETRIEVAL_HYBRID_ENABLED:true}
    keyword-weight: ${RETRIEVAL_KEYWORD_WEIGHT:0.35}

knowledge:
  parse:
    # 解析失败手动重试上限（需求 3.6.3(2)，默认 3 次，超限需人工介入）
    max-retries: ${KNOWLEDGE_PARSE_MAX_RETRIES:3}
    # 自动重试次数（指数退避 + 残留分段/向量补偿清理）
    auto-retries: ${KNOWLEDGE_PARSE_AUTO_RETRIES:2}
  ocr:
    # 扫描版 PDF/图片 OCR（需安装 tesseract；chi_sim+eng 需对应语言包）
    enabled: ${KNOWLEDGE_OCR_ENABLED:false}
    command: ${KNOWLEDGE_OCR_COMMAND:tesseract}
    languages: ${KNOWLEDGE_OCR_LANGUAGES:chi_sim+eng}
    max-pages: ${KNOWLEDGE_OCR_MAX_PAGES:20}
    dpi: ${KNOWLEDGE_OCR_DPI:150}

pgvector:
  url: ${PG_URL:jdbc:postgresql://localhost:5432/vector}
  username: ${PG_USERNAME:wangpan}
  password: ${PG_PASSWORD:}

asr:
  enabled: ${ASR_ENABLED:true}     # 本地 Qwen3-ASR（OpenAI 兼容协议，start-asr.sh 启动）
  type: local
  endpoint: ${ASR_ENDPOINT:http://127.0.0.1:8000}
  api-key: ${ASR_API_KEY:local}
  model: ${ASR_MODEL:/Users/wangpan/models/Qwen3-ASR-1.7B-8bit}
  timeout-ms: 60000

spring.servlet.multipart:
  max-file-size: 12MB
  max-request-size: 12MB

storage:
  # 大表月分区自动补齐（V48 创建初始分区；只补未来，不自动删历史）
  partition:
    enabled: ${PARTITION_MAINTENANCE_ENABLED:true}
    months-ahead: ${PARTITION_MONTHS_AHEAD:3}
    cron: ${PARTITION_MAINTENANCE_CRON:0 20 2 * * *}
  type: minio
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ai-agent-platform

# 内容审核 P0 规则（需求文档 3.21）：逗号分隔；第三方审核服务为 P1 可插拔
moderation:
  block-words: ${MODERATION_BLOCK_WORDS:赌博,毒品,代开发票}
  warn-words: ${MODERATION_WARN_WORDS:转账,汇款,银行卡号}
  # 流式输出按块前置审核（字符），命中 BLOCK 立即停止下发
  stream:
    buffer-chars: ${MODERATION_STREAM_BUFFER_CHARS:40}
  # 第三方审核 HTTP 适配器（可指向云厂商网关/自建服务）
  http:
    enabled: ${MODERATION_HTTP_ENABLED:false}
    endpoint: ${MODERATION_HTTP_ENDPOINT:}
    api-key: ${MODERATION_HTTP_API_KEY:}
    timeout-ms: ${MODERATION_HTTP_TIMEOUT_MS:3000}

otel:
  # 标准 OTLP Trace 导出（Jaeger/Tempo/Langfuse/Phoenix 等）
  enabled: ${OTEL_ENABLED:false}
  endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
  service-name: ${OTEL_SERVICE_NAME:ai-agent-platform}

mcp:
  resource:
    # resources/read / prompts/get 单次返回上限（字节/字符近似）
    max-bytes: ${MCP_RESOURCE_MAX_BYTES:1048576}

audit:
  # 审计保留：旧月分区先归档并写租户链锚点，再 DROP；手动触发走平台管理员接口
  archive:
    enabled: ${AUDIT_ARCHIVE_ENABLED:true}
    retention-days: ${AUDIT_RETENTION_DAYS:180}
    cron: ${AUDIT_ARCHIVE_CRON:0 10 4 * * *}

message:
  # 消息过期归档：整月分区先归档再 DROP；手动触发走平台管理员接口
  archive:
    enabled: ${MESSAGE_ARCHIVE_ENABLED:true}
    retention-days: ${MESSAGE_RETENTION_DAYS:90}
    cron: ${MESSAGE_ARCHIVE_CRON:0 40 3 * * *}

billing:
  # 余额低于该值时前端提示充值（需求 3.11）
  low-balance-threshold: ${BILLING_LOW_BALANCE_THRESHOLD:10}

app:
  # SSO 回调地址默认前端地址（/sso/callback）
  frontend-base: ${APP_FRONTEND_BASE:http://localhost:5173}
  # 后端对外地址（OAuth 2.1 回调）
  public-base: ${APP_PUBLIC_BASE:http://localhost:8080}
  mail:
    from: ${SMTP_FROM:no-reply@ai-agent.local}
