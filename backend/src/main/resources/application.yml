spring:
  application:
    name: ai-agent-platform
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_TLS:true}
      mail.smtp.starttls.required: ${SMTP_TLS:true}
  ai:
    openai:
      # DeepSeek 走 OpenAI 兼容协议；Key 后补，占位值保证未配置时应用可启动
      api-key: ${DEEPSEEK_API_KEY:sk-not-configured}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/ai_agent_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      # 未配置 SMTP 时避免整体健康检查 DOWN；配置 SMTP 后可设 SMTP_HEALTH_ENABLED=true
      enabled: ${SMTP_HEALTH_ENABLED:false}

# ---- 平台配置（架构 10.7）----
security:
  # 租户级接口限流（次/分钟，0=关闭；需求 3.22）
  rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:60}
  # 登录失败锁定（需求 3.25(1)）
  login:
    max-failures: ${LOGIN_MAX_FAILURES:5}
    lock-minutes: ${LOGIN_LOCK_MINUTES:15}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    expiry-seconds: 7200
  aes-key: ${AES_KEY:}          # 凭证加密密钥，M2 使用

llm:
  context:
    # 模型未配置 context_window 时的默认窗口；预留输出 Token；超限启用历史摘要压缩
    default-window: ${LLM_CONTEXT_DEFAULT_WINDOW:32768}
    reserve-tokens: ${LLM_CONTEXT_RESERVE_TOKENS:2048}
    compress-enabled: ${LLM_CONTEXT_COMPRESS:true}
  deepseek:
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}   # 后补；为空时模型相关功能返回「未配置」

embedding:
  provider: ollama
  endpoint: ${OLLAMA_ENDPOINT:http://localhost:11434}
  model: nomic-embed-text
  dimensions: 768

knowledge:
  parse:
    # 解析失败手动重试上限（需求 3.6.3(2)，默认 3 次，超限需人工介入）
    max-retries: ${KNOWLEDGE_PARSE_MAX_RETRIES:3}
    # 自动重试次数（指数退避 + 残留分段/向量补偿清理）
    auto-retries: ${KNOWLEDGE_PARSE_AUTO_RETRIES:2}

pgvector:
  url: ${PG_URL:jdbc:postgresql://localhost:5432/vector}
  username: ${PG_USERNAME:wangpan}
  password: ${PG_PASSWORD:}

asr:
  enabled: true                    # 本地 Qwen3-ASR（OpenAI 兼容协议，start-asr.sh 启动）
  type: local
  endpoint: ${ASR_ENDPOINT:http://127.0.0.1:8000}
  api-key: ${ASR_API_KEY:local}
  model: ${ASR_MODEL:/Users/wangpan/models/Qwen3-ASR-1.7B-8bit}
  timeout-ms: 60000

spring.servlet.multipart:
  max-file-size: 12MB
  max-request-size: 12MB

storage:
  type: minio
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ai-agent-platform

# 内容审核 P0 规则（需求文档 3.21）：逗号分隔；第三方审核服务为 P1 可插拔
moderation:
  block-words: 赌博,毒品,代开发票
  warn-words: 转账,汇款,银行卡号

billing:
  # 余额低于该值时前端提示充值（需求 3.11）
  low-balance-threshold: ${BILLING_LOW_BALANCE_THRESHOLD:10}

app:
  # SSO 回调地址默认前端地址（/sso/callback）
  frontend-base: ${APP_FRONTEND_BASE:http://localhost:5173}
  mail:
    from: ${SMTP_FROM:no-reply@ai-agent.local}
