spring:
  application:
    name: ai-agent-platform
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/ai_agent_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

# ---- 平台配置（架构 10.7）----
security:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    expiry-seconds: 7200
  aes-key: ${AES_KEY:}          # 凭证加密密钥，M2 使用

llm:
  deepseek:
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}   # 后补；为空时模型相关功能返回「未配置」

embedding:
  provider: ollama
  endpoint: ${OLLAMA_ENDPOINT:http://localhost:11434}
  model: nomic-embed-text
  dimensions: 768

asr:
  enabled: false                 # 接口样例后补，补齐后开启
  type: local
  endpoint: ${ASR_ENDPOINT:http://localhost:9000}
  timeout-ms: 30000

storage:
  type: minio
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ai-agent-platform
