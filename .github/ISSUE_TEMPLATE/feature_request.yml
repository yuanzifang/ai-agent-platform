name: 功能建议
description: 建议一个新功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解决的问题
      description: 这个功能解决什么痛点、什么场景下需要
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你期望的行为或交互；可选：备选方案、参考项目
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 截图、相关 Issue 链接等
