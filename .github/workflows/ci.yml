name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      local_model:
        description: '运行本地 Ollama 工作流 E2E（会拉取 qwen2.5:7b）'
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: 秘密扫描（gitleaks）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deps:
    name: 依赖漏洞扫描（trivy + npm audit）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 后端打包（跳过测试）
        working-directory: backend
        run: mvn -q package -DskipTests
      - name: Trivy 扫描后端制品（fat jar 内嵌依赖，不访问 Maven Central）
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: backend/target
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
      - name: 后端依赖许可证清单（观察模式）
        working-directory: backend
        run: |
          mvn -q org.codehaus.mojo:license-maven-plugin:2.5.0:add-third-party \
            -Dlicense.outputDirectory=target/licenses \
            -Dlicense.excludedScopes=test \
            -Dlicense.includeTransitiveDependencies=true

      - name: 前端依赖审计
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high || true   # 先观察基线

      - name: 前端依赖许可证基线
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: frontend/package-lock.json
          scanners: license
          format: json
          output: frontend-licenses.json
          exit-code: '0'

      - name: 许可证策略（阻断 AGPL/SSPL/GPL-only/unknown）
        run: python3 scripts/license_policy.py frontend-licenses.json backend/target/licenses/THIRD-PARTY.txt

      - name: 后端 SBOM（CycloneDX）
        working-directory: backend
        run: |
          mvn -q org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom \
            -DoutputFormat=json -DoutputName=bom

      - name: 前端 SBOM（CycloneDX）
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: frontend/package-lock.json
          format: cyclonedx
          output: frontend-sbom.cdx.json
          exit-code: '0'

      - name: 上传 SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            backend/target/bom.json
            frontend-sbom.cdx.json
          if-no-files-found: error

  gateway:
    name: 运行时网关/告警中继（Node 单测 + 镜像/容器冒烟）
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Gateway Node 单测
        working-directory: runtime/agent-gateway
        run: npm test

      - name: Alert-relay 依赖安装（ioredis/nodemailer）
        working-directory: runtime/alert-relay
        run: npm ci

      - name: Alert-relay Node 单测
        working-directory: runtime/alert-relay
        run: npm test

      - name: 构建运行时镜像
        run: |
          docker build -t agent-gateway:ci runtime/agent-gateway
          docker build -t alert-relay:ci runtime/alert-relay

      - name: 容器冒烟（健康检查/鉴权/模型/统计/CORS）
        run: |
          set -euo pipefail
          docker run -d --name agent-gateway-ci \
            --add-host=host.docker.internal:host-gateway \
            -e RUNTIME_TOKEN=ci-token \
            -e STATS_TOKEN=ci-stats \
            -e AGENT_SLUG=ci-agent \
            -e RATE_LIMIT_PER_MIN=1000 \
            -e CALLER_QUOTA_DAILY=1 \
            -e CORS_ORIGIN='*' \
            -e REDIS_URL=redis://host.docker.internal:6379/0 \
            -p 18081:8080 agent-gateway:ci
          trap 'docker logs agent-gateway-ci || true; docker rm -f agent-gateway-ci || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/v1/models)" = "401"
          curl -fsS http://127.0.0.1:18081/v1/models \
            -H 'Authorization: Bearer ci-token' | grep -q '"id":"ci-agent"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/v1/models \
            -H 'Authorization: Bearer ci-token')" = "429"
          curl -fsS http://127.0.0.1:18081/stats \
            -H 'Authorization: Bearer ci-stats' | grep -q '"store":"redis"'
          curl -fsS http://127.0.0.1:18081/stats \
            -H 'Authorization: Bearer ci-stats' | grep -q '"requests":1'
          curl -fsS -D /tmp/gateway-cors.headers -o /dev/null -X OPTIONS \
            http://127.0.0.1:18081/v1/models
          grep -qi 'access-control-allow-origin: \*' /tmp/gateway-cors.headers
          echo "gateway container smoke passed"

      - name: Alert-relay 容器冒烟
        run: |
          set -euo pipefail
          docker run -d --name alert-relay-ci -p 18082:8080 alert-relay:ci
          trap 'docker logs alert-relay-ci || true; docker rm -f alert-relay-ci || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18082/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18082/healthz)" = "200"
          curl -fsS -X POST http://127.0.0.1:18082/alertmanager \
            -H 'Content-Type: application/json' \
            -d '{"alerts":[]}' | grep -q '"configured":false'
          echo "alert-relay container smoke passed"

      - name: Gateway 镜像 SBOM（CycloneDX）
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: agent-gateway:ci
          format: cyclonedx
          output: gateway-sbom.cdx.json
          exit-code: '0'

      - name: Alert-relay 镜像 SBOM（CycloneDX）
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: alert-relay:ci
          format: cyclonedx
          output: alert-relay-sbom.cdx.json
          exit-code: '0'

      - name: 上传运行时镜像 SBOM
        uses: actions/upload-artifact@v4
        with:
          name: runtime-image-sbom
          path: |
            gateway-sbom.cdx.json
            alert-relay-sbom.cdx.json
          if-no-files-found: error

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 部署运行时真实 Docker 冒烟（create/start/inspect/logs/stop/remove）
        working-directory: backend
        env:
          DOCKER_IT: '1'
          DOCKER_IT_IMAGE: agent-gateway:ci
        run: mvn -q -Dtest=DockerCliRuntimeIT test

  build:
    name: 后端构建 + 前端类型检查/构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 运维脚本语法检查
        run: bash -n scripts/*.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 中文检索黄金集/脚本校验
        run: |
          python3 -m py_compile scripts/eval_chinese_retrieval.py
          python3 -c "import json; d=json.load(open('docs/fixtures/中文检索黄金集-v1.json')); ids={x['id'] for x in d['documents']}; assert d['queries'] and all(set(q['relevant'])<=ids for q in d['queries']); print('chinese retrieval fixture ok')"

      - name: 安装 OCR 测试依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim

      - name: 后端打包 + 单元测试
        working-directory: backend
        run: mvn -q package

      - name: 后端 i18n key 一致性
        run: python3 scripts/check-backend-i18n.py

      - name: MVP 安全/冻结默认值检查
        run: python3 scripts/check-mvp-freeze.py

      - name: PDF 解析快照回归（标题/表格/页码覆盖阈值）
        working-directory: backend
        run: mvn -q -Dtest=PdfSnapshotTest test

      - name: 校验测试无跳过
        working-directory: backend
        run: |
          if grep -R -E 'Tests run:.*Skipped: [1-9]' target/surefire-reports/*.txt; then
            echo "存在跳过测试，请补齐测试依赖或移除 Assumptions" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 前端依赖
        working-directory: frontend
        run: npm ci

      - name: 前端 i18n key 一致性
        working-directory: frontend
        run: node scripts/check-i18n-keys.cjs

      - name: 前端类型检查
        working-directory: frontend
        run: npx vue-tsc --noEmit

      - name: 前端构建
        working-directory: frontend
        run: npm run build

  e2e:
    name: 浏览器 E2E（${{ matrix.browser }}）
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]   # project name 保持 chromium，实际使用 channel: chrome
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ai_agent_platform
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: vector
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d vector"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ''
      PG_URL: jdbc:postgresql://127.0.0.1:5432/vector
      PG_USERNAME: postgres
      PG_PASSWORD: postgres
      # E2E 不测知识库上传，MinIO/Ollama 可缺省；关闭 ASR 避免额外依赖
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      OLLAMA_ENDPOINT: http://127.0.0.1:11434
      DEEPSEEK_API_KEY: sk-ci-mock-key
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
      AES_KEY: ci-only-aes-key-0123456789abcdef0123456789abcdef
      PLATFORM_ADMIN_PASSWORD: Admin@123456
      DEV_PASSWORD: Dev@123456
      ASR_ENABLED: 'false'
      SKILL_SCRIPT_ENABLED: 'true'
      TOOL_ALLOW_PRIVATE: 'true'
      RATE_LIMIT_PER_MINUTE: '600'
      OTEL_ENABLED: 'true'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:18097

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 OCR 测试依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim

      - name: 后端打包 + 单元测试
        working-directory: backend
        run: mvn -q package

      - name: 校验测试无跳过
        working-directory: backend
        run: |
          if grep -R -E 'Tests run:.*Skipped: [1-9]' target/surefire-reports/*.txt; then
            echo "存在跳过测试，请补齐测试依赖或移除 Assumptions" >&2
            exit 1
          fi

      - name: 前端依赖
        working-directory: frontend
        run: npm ci

      - name: 安装 Playwright 浏览器（Google Chrome）
        working-directory: frontend
        run: |
          npx playwright install --with-deps chrome

      - name: 缓存 Ollama 模型（手动本地模型 E2E）
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.local_model == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen25-7b-v1

      - name: 安装并启动 Ollama（手动本地模型 E2E）
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.local_model == 'true'
        timeout-minutes: 20
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            nohup ollama serve > /tmp/ollama.log 2>&1 &
          fi
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              echo "ollama ready"
              break
            fi
            sleep 2
          done
          ollama pull qwen2.5:7b

      - name: 启动离线模型/嵌入/渠道 Mock
        working-directory: frontend
        run: |
          nohup python3 e2e/mock_servers.py > /tmp/mock-servers.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/v1/models >/dev/null 2>&1; then
              echo "mock ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mock-servers.log
          exit 1

      # MinIO 官方三渠道已停匿名分发：dl.min.io 二进制 410、quay 匿名 401、Docker Hub minio/minio 转私有。
      # Homebrew 公式改为 GitHub 源码构建且提供 x86_64_linux bottle（走 Homebrew 自有 CDN），不受影响。
      # Linux Runner 未预装 brew（仅 macOS 预装），先非交互安装。
      - name: 安装并启动 MinIO（Homebrew bottle）
        run: |
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv bash)"
          brew install minio
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin \
            nohup minio server /tmp/minio-data --address :9000 --console-address :9001 > /tmp/minio.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              echo "minio ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/minio.log
          exit 1

      - name: 初始化 pgvector 扩展（pgvector 镜像不自动 CREATE EXTENSION，本地库早已建过故首跑才暴露）
        run: |
          docker exec ${{ job.services.pgvector.id }} psql -U postgres -d vector \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: 启动后端
        working-directory: backend
        run: |
          nohup mvn -q spring-boot:run > /tmp/backend.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null 2>&1; then
              echo "backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "backend failed to become healthy"
          tail -200 /tmp/backend.log
          exit 1

      - name: 内置 DeepSeek Provider 指向 Mock（后端首启建表后）
        run: |
          docker exec ${{ job.services.mysql.id }} mysql -uroot -proot ai_agent_platform \
            -e "UPDATE provider SET base_url='http://127.0.0.1:18080' WHERE provider_type='DEEPSEEK';"

      - name: 注册本地 Ollama 模型（手动本地模型 E2E）
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.local_model == 'true'
        run: python3 scripts/setup-local-ci-model.py --base-url http://127.0.0.1:8080

      - name: 放宽 E2E 租户限流
        run: |
          # E2E 批量轮询会集中打到同一分钟，限流本身另有“配额阻断”用例覆盖
          docker exec ${{ job.services.mysql.id }} mysql -uroot -proot ai_agent_platform \
            -e "UPDATE sys_tenant_quota SET max_api_calls_per_min=100000;"

      - name: 启动前端
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173 >/dev/null 2>&1; then
              echo "frontend ready"
              exit 0
            fi
            sleep 2
          done
          echo "frontend failed to start"
          tail -100 /tmp/frontend.log
          exit 1

      - name: 运行 Playwright E2E
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          E2E_BROWSER: ${{ matrix.browser }}
          E2E_OTEL: "1"
          # 网关门禁 UI 用例暂时隔离，由独立任务修复；不影响其余 E2E 回归。
          E2E_GATE_QUARANTINE: "1"
        run: npm run test:e2e -- --project=${{ matrix.browser }}

      - name: 运行本地 Ollama 工作流 E2E（手动触发）
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.local_model == 'true'
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          E2E_LOCAL_WORKFLOW: '1'
        run: npx playwright test e2e/workflow-all-cases.spec.ts --project=${{ matrix.browser }}

      - name: 失败时输出后端/前端日志
        if: failure()
        run: |
          echo "===== backend.log ====="
          tail -200 /tmp/backend.log || true
          echo "===== frontend.log ====="
          tail -100 /tmp/frontend.log || true

      - name: 上传 Playwright 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
