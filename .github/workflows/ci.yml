name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: 秘密扫描（gitleaks）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deps:
    name: 依赖漏洞扫描（trivy + npm audit）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy 文件系统扫描（依赖/配置 HIGH/CRITICAL）
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '0'          # 先观察基线，稳定后改 1 转为阻断
          ignore-unfixed: true
      - name: 前端依赖审计
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high || true   # 先观察基线

  build:
    name: 后端构建 + 前端类型检查/构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 运维脚本语法检查
        run: bash -n scripts/*.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 后端打包 + 单元测试
        working-directory: backend
        run: mvn -q package

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 前端依赖
        working-directory: frontend
        run: npm ci

      - name: 前端类型检查
        working-directory: frontend
        run: npx vue-tsc --noEmit

      - name: 前端构建
        working-directory: frontend
        run: npm run build

  e2e:
    name: 浏览器 E2E（${{ matrix.browser }}）
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, msedge]   # Edge 兼容（需求 5.1）先观察，稳定后可移除 msedge
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ai_agent_platform
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: vector
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d vector"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ''
      PG_URL: jdbc:postgresql://127.0.0.1:5432/vector
      PG_USERNAME: postgres
      PG_PASSWORD: postgres
      # E2E 不测知识库上传，MinIO/Ollama 可缺省；关闭 ASR 避免额外依赖
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      OLLAMA_ENDPOINT: http://127.0.0.1:11434
      DEEPSEEK_API_KEY: sk-ci-mock-key
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
      AES_KEY: ci-only-aes-key-0123456789abcdef0123456789abcdef
      PLATFORM_ADMIN_PASSWORD: Admin@123456
      DEV_PASSWORD: Dev@123456
      ASR_ENABLED: 'false'
      SKILL_SCRIPT_ENABLED: 'true'
      TOOL_ALLOW_PRIVATE: 'true'
      RATE_LIMIT_PER_MINUTE: '600'
      OTEL_ENABLED: 'true'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:18097

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 后端打包 + 单元测试
        working-directory: backend
        run: mvn -q package

      - name: 前端依赖
        working-directory: frontend
        run: npm ci

      - name: 安装 Playwright 浏览器（chromium / msedge）
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          if [ "${{ matrix.browser }}" = "msedge" ]; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft.gpg
            echo "deb [signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/edge stable main" | sudo tee /etc/apt/sources.list.d/microsoft-edge.list
            sudo apt-get update -qq
            sudo apt-get install -y microsoft-edge-stable
            npx playwright install --with-deps msedge
          fi

      - name: 启动离线模型/嵌入/渠道 Mock
        working-directory: frontend
        run: |
          nohup python3 e2e/mock_servers.py > /tmp/mock-servers.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/v1/models >/dev/null 2>&1; then
              echo "mock ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mock-servers.log
          exit 1

      - name: 内置 DeepSeek Provider 指向 Mock
        run: |
          docker exec ${{ job.services.mysql.id }} mysql -uroot -proot ai_agent_platform \
            -e "UPDATE provider SET base_url='http://127.0.0.1:18080' WHERE provider_type='DEEPSEEK';"

      - name: 启动后端
        working-directory: backend
        run: |
          nohup mvn -q spring-boot:run > /tmp/backend.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null 2>&1; then
              echo "backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "backend failed to become healthy"
          tail -200 /tmp/backend.log
          exit 1

      - name: 放宽 E2E 租户限流
        run: |
          # E2E 批量轮询会集中打到同一分钟，限流本身另有“配额阻断”用例覆盖
          docker exec ${{ job.services.mysql.id }} mysql -uroot -proot ai_agent_platform \
            -e "UPDATE sys_tenant_quota SET max_api_calls_per_min=100000;"

      - name: 启动前端
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173 >/dev/null 2>&1; then
              echo "frontend ready"
              exit 0
            fi
            sleep 2
          done
          echo "frontend failed to start"
          tail -100 /tmp/frontend.log
          exit 1

      - name: 运行 Playwright E2E
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          E2E_BROWSER: ${{ matrix.browser }}
        run: npm run test:e2e -- --project=${{ matrix.browser }}

      - name: 失败时输出后端/前端日志
        if: failure()
        run: |
          echo "===== backend.log ====="
          tail -200 /tmp/backend.log || true
          echo "===== frontend.log ====="
          tail -100 /tmp/frontend.log || true

      - name: 上传 Playwright 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
